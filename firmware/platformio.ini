; PlatformIO Project Configuration File for SMART-GROW
; Board: LONELY BINARY ESP32-S3 N16R8 Gold Edition (16MB Flash, 8MB PSRAM OPI)

[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Configuración específica de hardware para 16MB Flash y 8MB Octal PSRAM
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = opi
board_build.arduino.memory_type = opi_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Opciones del monitor serial
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Flags de compilación
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; 0 para usar el chip USB-UART CP2102/CH343 integrado

; Dependencias de bibliotecas verificadas
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^6.21.4
